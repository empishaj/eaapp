<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#10253e" />
  <meta name="description" content="EA Learnings – Enterprise Architecture Lernbibliothek für Behördenkontext" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="assets/styles.css" />
  <title>EA Learnings</title>
</head>
<body>
  <div id="updateBanner" class="update-banner hidden" role="status">
    <div><strong>Neue Version verfügbar.</strong> <span id="updateMessage">Inhalte wurden aktualisiert.</span></div>
    <button id="reloadUpdate" class="btn btn-light">Aktualisieren</button>
  </div>

  <header class="topbar">
    <a href="#home" class="brand" aria-label="EA Learnings Startseite">
      <span class="brand-mark">EA</span>
      <span><strong>EA Learnings</strong><small>Enterprise Architecture · Behördenkontext</small></span>
    </a>
    <div class="top-actions">
      <button id="installBtn" class="btn btn-outline hidden">App installieren</button>
      <span id="onlineState" class="status-pill">Online</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav class="main-nav" aria-label="Hauptnavigation">
        <a href="#home" data-nav="home">Übersicht</a>
        <a href="#library" data-nav="library">Bibliothek</a>
        <a href="#favorites" data-nav="favorites">Favoriten</a>
        <a href="#progress" data-nav="progress">Lernfortschritt</a>
        <a href="#memory" data-nav="memory">Speicher & Reset</a>
        <a href="#about" data-nav="about">Über die App</a>
      </nav>
      <div class="sidebar-section">
        <label for="globalSearch">Volltextsuche</label>
        <input id="globalSearch" type="search" placeholder="z. B. ADR, IAM, RPO …" autocomplete="off" />
      </div>
      <div class="sidebar-section">
        <div class="muted small">Content-Version</div>
        <strong id="contentVersion">–</strong>
      </div>
    </aside>

    <main id="app" class="main" tabindex="-1"></main>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
